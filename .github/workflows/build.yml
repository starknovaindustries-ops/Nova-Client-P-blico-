name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip
        run: unzip -q *.zip -d src
      - name: Build
        run: |
          cd src/Nova-Client-2.26
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../build.log
      - name: Resumo dos erros
        if: failure()
        run: |
          grep -E "error:|^e: |What went wrong|Could not" -A2 build.log | head -80 >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-client-debug
          path: src/Nova-Client-2.26/app/build/outputs/apk/debug/*.apk
